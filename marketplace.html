<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>AIGentFlow - Marketplace</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./assets/styles/main.css">
    </head>

    <body class="page-marketplace">

        <nav class="navbar" aria-label="Main">
            <a class="navbar__logo">AIGentFlow</a>

            <ul class="navbar__links">
                <li><a class="navbar__link" href="dashboard.html">Dashboard</a></li>
                <li><a class="navbar__link" href="marketplace.html" aria-current="page">Marketplace</a></li>
                <li><a class="navbar__link" href="admin.html">Admin</a></li>
            </ul>

            <div class="navbar__user">
                <span id="nav-username">username</span>
            </div>
        </nav>

        <main class="container">
            <h1 class="page-title">Marketplace</h1>

            <p class="checkout-status" id="checkout-status" hidden></p>

            <!-- mock teams for testing checkout; the data-team ids have to match MOCK_TEAMS in backend/main.py -->
            <section class="team-grid" aria-label="Teams for sale">
                <div class="card team">
                    <h2 class="card__title">Geopolitics Team</h2>
                    <p class="team__price">$9.99</p>
                    <button class="btn" type="button" data-team="mock-geopolitics">Buy</button>
                </div>
                <div class="card team">
                    <h2 class="card__title">Sports Betting Team</h2>
                    <p class="team__price">$14.99</p>
                    <button class="btn" type="button" data-team="mock-sports-betting">Buy</button>
                </div>
            </section>
        </main>

        <script src="./assets/scripts/main.js"></script>
    </body>
</html>
